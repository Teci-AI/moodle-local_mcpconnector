name: Release

# Publishes a GitHub release with the installable plugin zip when a version tag (v0.1.0…) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tag
        uses: actions/checkout@v5

      - name: Check the tag matches version.php
        id: version
        run: |
          release=$(sed -n "s/^\$plugin->release *= *'\(.*\)';/\1/p" version.php)
          version=$(sed -n 's/^\$plugin->version *= *\([0-9]*\);.*/\1/p' version.php)
          maturity=$(sed -n 's/^\$plugin->maturity *= *\(MATURITY_[A-Z]*\);.*/\1/p' version.php)
          if [ "v$release" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match \$plugin->release '$release' in version.php"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "maturity=$maturity" >> "$GITHUB_OUTPUT"
          label=${maturity#MATURITY_}
          echo "label=${label,,}" >> "$GITHUB_OUTPUT"

      - name: Build the plugin zip
        run: |
          # .gitattributes keeps CI files out of the archive; the zip has the single folder Moodle expects.
          git archive --format=zip --prefix=mcpconnector/ \
            -o "local_mcpconnector_${{ steps.version.outputs.release }}_${{ steps.version.outputs.version }}.zip" HEAD

      - name: Take the release notes from CHANGES.md
        run: |
          awk -v heading="## ${{ steps.version.outputs.release }} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGES.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGES.md has no section starting with '## ${{ steps.version.outputs.release }} '"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "${{ steps.version.outputs.maturity }}" != "MATURITY_STABLE" ]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" local_mcpconnector_*.zip \
            --title "$GITHUB_REF_NAME (${{ steps.version.outputs.label }}, ${{ steps.version.outputs.version }})" \
            --notes-file notes.md $prerelease
